<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collins Martins - Business Products Branding Designer</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0f0f0f;color:#fff;line-height:1.6}
h1,h2,h3{font-family:'Syne',sans-serif}
a{text-decoration:none;color:inherit}
.nav{padding:20px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
.logo{font-weight:800;font-size:20px}
.logo span{color:#C6FF00}
.btn{background:#C6FF00;color:#000;padding:12px 24px;border-radius:100px;font-weight:600;display:inline-block}
.hero{padding:80px 6%;display:grid;grid-template-columns:1.2fr 0.8fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(36px,5vw,68px);line-height:0.95}
.hero h1 span{color:#C6FF00}
.hero p{margin:20px 0;color:#aaa;font-size:18px;max-width:500px}
.grid{padding:40px 6%;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{background:#181818;border:1px solid #222;padding:30px;border-radius:20px}
.card h3{margin-bottom:10px}
.card p{color:#aaa;font-size:14px}
.section-title{padding:0 6%;font-size:32px;margin-top:60px}
.portfolio{padding:20px 6%;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.p-item{background:#181818;border-radius:20px;overflow:hidden;border:1px solid #222}
.p-item img{width:100%;height:220px;object-fit:cover}
.p-item div{padding:20px}
.p-item div small{color:#C6FF00;letter-spacing:1px}
.case-study{margin:60px 6%;background:#C6FF00;color:#000;border-radius:30px;padding:50px;display:grid;grid-template-columns:1fr 1fr;gap:40px}
.case-study h2{font-size:40px;line-height:0.9}
.footer{padding:60px 6%;text-align:center;border-top:1px solid #222;margin-top:40px}
@media(max-width:800px){.hero,.case-study{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="nav">
<div class="logo">COLLINS <span>MARTINS.</span></div>
<a href="#contact" class="btn">Hire Me</a>
</div>

<div class="hero">
<div>
<h1>I TRANSFORM <br>BUSINESS PRODUCTS <br><span>INTO BRANDS THAT SELL.</span></h1>
<p>I'm a Business Products Branding Designer based in Abuja, Nigeria. I help startups turn ordinary products into premium, shelf-ready brands
